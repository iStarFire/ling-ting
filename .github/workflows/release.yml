name: Release APK

# 打形如 v1.0.0 的 tag 时自动构建并发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN 需要写权限才能创建 Release
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉取完整历史，用于生成两个 tag 之间的 changelog
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 规避仓库内 gradle.properties 里的本机 JDK 路径（org.gradle.java.home）
      # 用环境变量覆盖为 CI 上的 JAVA_HOME
      - name: Build signed Release APK
        env:
          ORG_GRADLE_PROJECT_org.gradle.java.home: ${{ env.JAVA_HOME }}
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # 将 secrets 中的 base64 keystore 还原为文件（未配置时跳过，回退 debug 签名）
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RELEASE_KEYSTORE_PATH"
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          # 找到上一个 tag（不含当前），首次发布则从最早 commit 开始
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          CURRENT_TAG="${{ github.ref_name }}"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
          else
            FIRST=$(git rev-list --max-parents=0 HEAD)
            RANGE="${FIRST}..${CURRENT_TAG}"
          fi

          # 收集提交，过滤常见的 merge/CI 噪音
          COMMITS=$(git log --oneline --no-merges "${RANGE}" | grep -viE 'merge|release|ci\(|bump|chore\(release' || true)

          {
            echo "## LingTing ${{ steps.version.outputs.version }}"
            echo ""
            echo "自动构建并签名，可直接安装。"
            echo ""
            echo "### 本次更新"
            echo ""
            if [ -z "$COMMITS" ]; then
              echo "- 无显著代码变更（可能仅版本号更新）。"
            else
              echo "$COMMITS" | sed 's/^/- /'
            fi
          } > changelog.md

          echo "released=${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            cp "$apk" "app/build/outputs/apk/release/LingTing-v${{ steps.version.outputs.version }}.apk"
          done

      - name: Upload release APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LingTing ${{ steps.version.outputs.version }}
          body_path: changelog.md
          files: |
            app/build/outputs/apk/release/LingTing-v${{ steps.version.outputs.version }}.apk
            app/build/outputs/mapping/release/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
